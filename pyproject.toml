[project]
name = "dzshop-agent"
version = "0.1.0"
description = "AI customer-service and COD order agent for small Algerian e-commerce shops (Darija / Arabic / French)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dzshop"]

[tool.setuptools.package-data]
dzshop = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
